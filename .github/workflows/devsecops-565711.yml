
name: DevSecOps-565711

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -r worker/requirements.txt
          python -m compileall -q app.py loja worker

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          python -m pip install semgrep
          semgrep scan --config auto --severity ERROR --error --json --output sast.json .
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sast-report
          path: sast.json

  segredos:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --exit-code 1 \
            --report-format json \
            --report-path /repo/segredos.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: segredos-report
          path: segredos.json

  sca:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          docker run --rm -v "$PWD:/src" \
            aquasec/trivy:0.69.3 fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /src/sca.json /src
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sca-report
          path: sca.json

  testes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/ -v

  imagem:
    needs: [sast, segredos, sca, testes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          docker build -t ctmarket:565711 .
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/src" \
            aquasec/trivy:0.69.3 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /src/imagem.json \
            ctmarket:565711
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: imagem-report
          path: imagem.json

  dast:
    needs: imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          docker build -t ctmarket:565711 .
          docker run -d --name market \
            -p 8342:8342 ctmarket:565711
          sleep 15
          curl --fail http://localhost:8342/
      - run: |
          docker run --rm --network host \
            -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:8342 \
            -J dast.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dast-report
          path: dast.json

  deploy:
    needs: [build, sast, segredos, sca, testes, imagem, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Security gates aprovados. Deploy autorizado."

